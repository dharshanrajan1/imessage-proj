<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>iMessage Wrapped</title>
  <!-- Applied before first paint so a manually-chosen theme never flashes the
       system one on the way in. Inline by necessity: an external file would be
       fetched after the parser has already painted. -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app">

    <!-- ================= Toolbar ================= -->
    <header class="toolbar material-glass">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Show conversations" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>

      <span class="toolbar-brand">iMessage Wrapped</span>

      <span class="toolbar-spacer"></span>

      <div class="toolbar-filters">
        <!-- Filters live in the toolbar because they apply to everything below
             it, in every scope. Placing a control next to what it affects is
             the whole reason the scope picker is in the sidebar and these
             are not. -->
        <div class="select-wrap">
          <label class="visually-hidden" for="dateRangeSelect">Time range</label>
          <select id="dateRangeSelect" class="control">
            <option value="all">All time</option>
            <option value="1y">Last year</option>
            <option value="6m">Last 6 months</option>
            <option value="3m">Last 3 months</option>
            <option value="30d">Last 30 days</option>
            <option value="custom">Custom range…</option>
          </select>
        </div>

        <div id="customDateRange" class="toolbar-filters" hidden>
          <label class="visually-hidden" for="startDateInput">Start date</label>
          <input type="date" id="startDateInput" class="control">
          <label class="visually-hidden" for="endDateInput">End date</label>
          <input type="date" id="endDateInput" class="control">
          <button id="applyDateRange" class="control">Apply</button>
        </div>

        <div class="segmented" id="chatTypeToggle" role="group" aria-label="Conversation type">
          <button type="button" data-type="all" aria-pressed="true">All</button>
          <button type="button" data-type="dm" aria-pressed="false">DMs</button>
          <button type="button" data-type="group" aria-pressed="false">Groups</button>
        </div>

        <button class="theme-toggle" id="themeToggle" aria-label="Switch appearance" title="Switch appearance">
          <svg id="themeIconLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
          </svg>
          <svg id="themeIconDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ================= Sidebar: the single navigator =================

         Everything to the right of this is a view of whatever is selected
         here. "Everyone" is a scope like any other and therefore an ordinary
         row in the same list -- things that behave the same must look the
         same and live in the same place.
    ================================================================== -->
    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <nav class="sidebar material-glass" id="sidebar" aria-label="Conversations">
      <div class="sidebar-search">
        <label class="visually-hidden" for="chatSearch">Search conversations</label>
        <input type="text" id="chatSearch" class="control" placeholder="Search" autocomplete="off" spellcheck="false">
      </div>
      <div class="sidebar-scroll" id="scopeList"></div>
    </nav>

    <!-- ================= Content ================= -->
    <main class="content">
      <div class="scope-header">
        <h1 class="scope-title" id="scopeTitle">Everyone</h1>
        <p class="scope-sub" id="scopeSub"></p>

        <div class="tabbar" id="tabBar" role="tablist" aria-label="Views">
          <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
        </div>
      </div>

      <div class="content-scroll" id="contentScroll">
        <div id="loadingState" class="state">
          <div class="spinner" aria-hidden="true"></div>
          <p>Reading your messages…</p>
        </div>

        <div id="errorState" class="state" hidden>
          <h2 class="state-title">Couldn't load your data</h2>
          <p class="error-note" id="errorMessage"></p>
        </div>

        <!-- Views are created and torn down by app.js against the current
             scope, so there is never a tab that leads somewhere empty. -->
        <div id="viewHost" hidden></div>
      </div>
    </main>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
